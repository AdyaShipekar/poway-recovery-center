<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | Poway Recovery Center</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">Poway <span>Recovery</span> Center</a><button class="menu-toggle" aria-label="Open navigation">☰</button><nav class="main-nav"><a class="active" href="login.html">Log In</a><a href="resources.html">Resources</a><a href="programs.html">Programs</a><a href="about.html">About Us</a></nav></header><aside class="crisis-banner"><span class="pulse"></span><div><strong>Need help now?</strong><small>Call or text 988</small></div><a href="tel:988">988</a></aside>
<main class="login-page"><div class="login-card"><p class="eyebrow">Welcome</p><h1>Create your account.</h1><p class="login-intro">Save your contact details and keep your meetings and resources in one place. Only your name, username, and password are required.</p><form id="signup-form"><label>Name<input type="text" name="name" required autocomplete="name" placeholder="First and last name"></label><label>Username<input type="text" name="uid" required minlength="3" maxlength="40" pattern="[A-Za-z0-9._\-]+" autocomplete="username" placeholder="Letters, numbers, dots or dashes"></label><label>Email address <small>(optional)</small><input type="email" name="email" autocomplete="email" placeholder="Your email address"></label><label>Phone number <small>(optional)</small><input type="tel" name="phone" autocomplete="tel" placeholder="(858) 555-0123"></label><label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><label>Confirm password<input type="password" name="confirm" required minlength="6" autocomplete="new-password" placeholder="••••••••"></label><button class="button button-primary full">Create account</button><p class="form-message" id="signup-message" role="status"></p></form><p class="signup">Already have an account? <a href="login.html">Log in</a></p></div></main><script src="js/main.js"></script><script type="module" src="js/api/login.js"></script><script type="module" src="js/signup.js"></script></body></html>
